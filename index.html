  /* 一定の間隔で部屋の状態を読みに行く */
  function poller(api, q, ms, onView, onErr) {
    let v = 0, stopped = false, t = null, offset = 0;
    async function tick() {
      if (stopped) return;
      try {
        const r = await api.state(Object.assign({}, q, { v: v || '' }));
        if (stopped) return;
        if (r && r.ok) {
          if (r.now) offset = r.now - Date.now();
          if (r.view) { offset = r.view.now - Date.now(); v = r.view.v; onView(r.view, offset); }
        } else if (onErr) onErr(r && r.error);
      } catch (e) { if (onErr) onErr('network'); }
      const wait = document.hidden ? ms * 3 : ms;
      t = setTimeout(tick, api.local ? 700 : wait);
    }
    tick();
    const ctl = {
      stop: function () { stopped = true; clearTimeout(t); },
      push: function (view) { if (view) { v = view.v; offset = view.now - Date.now(); onView(view, offset); } },
      offset: function () { return offset; },
    };
    onLeave(ctl.stop);
    return ctl;
  }
  function timerEl(getView, getOffset) {
    const el = h('span', { class: 'timer', 'aria-live': 'off' });
    function paint() {
      const v = getView(); const tm = v && v.timer;
      if (!tm) { el.hidden = true; return; }
      el.hidden = false;
      const left = Math.max(0, Math.round((tm.end - (Date.now() + getOffset())) / 1000));
      el.textContent = Math.floor(left / 60) + ':' + String(left % 60).padStart(2, '0');
      el.classList.toggle('done', left === 0);
    }
    const t = setInterval(paint, 500); onLeave(function () { clearInterval(t); });
    paint(); el.paint = paint;
    return el;
  }
  function phaseLabel(id) {
    if (id === 'lobby') return '受付';
    const p = PHASES.find(function (x) { return x.id === id; }); return p ? p.label : id;
  }

  function mountDesk(root, api, code, tok) {
    let view = null, phase = null, draftDirty = false;
    const band = h('div', { class: 'desk-band' });
    const main = h('div', { class: 'wrap wide desk' });
    add(root, band, main);
    const tmr = timerEl(function () { return view; }, function () { return poll.offset(); });
    const poll = poller(api, { code: code, tok: tok }, 2500, function (v) { view = v; render(); }, function (e) { if (e === 'no_room') fill(main, h('p', { class: 'warn', text: errText(e) })); });

    async function act(body) {
      let r;
      try { r = await api.act(Object.assign({ code: code, tok: tok }, body)); } catch (e) { r = { ok: false, error: 'network' }; }
      if (!r || !r.ok) { alertBox(errText(r && r.error)); return null; }
      poll.push(r.view);
      return r;
    }
    let loadingAg = false;
    function render() {
      const ag = agendaById(view.agenda);
      if (!ag) { if (!loadingAg) { loadingAg = true; Box.ensure(view.agenda).then(function () { loadingAg = false; if (agendaById(view.agenda)) render(); }); } return; }
      paintBand(ag);
      if (view.phase !== phase) { phase = view.phase; draftDirty = false; mount(ag); }
      update(ag);
    }
    function paintBand(ag) {
      const i = MUN.ROOM_PHASES.indexOf(view.phase);
      const next = MUN.ROOM_PHASES[i + 1], prev = MUN.ROOM_PHASES[i - 1];
      fill(band, h('div', { class: 'wrap wide band-in' },
        h('div', { class: 'band-code' }, h('span', { class: 'band-k', text: '参加コード' }), h('span', { class: 'band-n', text: view.code })),
        h('div', { class: 'band-mid' },
          h('p', { class: 'band-ag', text: ag.short + '｜' + ag.title }),
          h('ol', { class: 'band-steps' }, MUN.ROOM_PHASES.map(function (p, k) { return h('li', { class: k < i ? 'done' : (k === i ? 'now' : '') }, phaseLabel(p)); }))),
        h('div', { class: 'band-acts' },
          tmr,
          prev ? btn('戻る', function () { act({ a: 'phase', phase: prev }); }, 'small ghost-inv') : null,
          next ? btn('次へ：' + phaseLabel(next), function () { act({ a: 'phase', phase: next }); }, 'small inv') : null)));
      tmr.paint();
    }
    function timerRow() {
      return h('div', { class: 'row wrapr timer-row' }, h('span', { class: 'muted small', text: 'タイマー' }),
        [3, 5, 10].map(function (m) { return btn(m + '分', function () { act({ a: 'timer', sec: m * 60 }); }, 'small ghost'); }),
        btn('止める', function () { act({ a: 'timer', sec: 0 }); }, 'small ghost'));
    }
    const P = {};
    function mount(ag) {
      fill(main);
      Object.keys(P).forEach(function (k) { delete P[k]; });
      const ph = view.phase;
      if (ph === 'lobby' || ph === 'prep') {
        P.count = h('p', { class: 'desk-count' });
        P.roster = h('div', { class: 'roster' });
        add(main, 
          ph === 'lobby' ? h('div', { class: 'howjoin' },
            h('p', { class: 'hj-1', text: 'このゲームのページをひらき、「クラスで遊ぶ」→「生徒：参加する」' }),
            h('p', { class: 'hj-2' }, '参加コード ', h('strong', { text: view.code }), ' を入力しよう')) :
            chair('各国の代表は、ポジションペーパーを読んで、自分の国の立場を確かめてください。'),
          P.count, P.roster, ph === 'prep' ? timerRow() : null);
      } else if (ph === 'speech') {
        P.spot = h('div', { class: 'spot' });
        P.list = h('ul', { class: 'speeches' });
        add(main, chair('一般討論を始めます。生徒は演説を書いて提出してください。読み上げる演説を選ぶと、ここに大きく映ります。'), timerRow(),
          h('div', { class: 'desk-2' }, P.spot, h('div', {}, h('h2', { class: 'sec-title', text: '提出された演説' }), P.list)));
      } else if (ph === 'nego') {
        P.heat = h('div', { class: 'heat' });
        add(main, chair('非公式協議の時間です。まわりの国と話し合い、自分の国が支持する案を選んでください。'), timerRow(), P.heat);
      } else if (ph === 'draft') {
        P.form = h('div', { class: 'clauses' });
        P.doc = h('div', {});
        add(main, chair('決議案をまとめます。支持の多い案が最初に選ばれています。話し合いで変えてもかまいません。'),
          h('div', { class: 'draft' }, P.form, h('aside', { class: 'forecast' }, h('h2', { class: 'fc-t', text: '決議案' }), P.doc)));
      } else if (ph === 'vote') {
        P.count = h('p', { class: 'desk-count' });
        P.board = h('div', {});
        add(main, chair('これより決議案 ' + ag.sym + ' の投票を行います。各国の代表は、賛成・反対・棄権を選んでください。'), timerRow(), P.count, P.board);
      } else if (ph === 'result') {
        P.res = h('div', {});
        add(main, P.res);
      }
    }
    function update(ag) {
      const ph = view.phase;
      if (P.roster) {
        P.count.textContent = '参加 ' + view.count + '人　｜　' + view.countries.length + 'か国';
        const byC = {};
        (view.players || []).forEach(function (p) { (byC[p.country] = byC[p.country] || []).push(p); });
        fill(P.roster, MUN.seatOrder(ag).filter(function (c) { return byC[c]; }).map(function (c) {
          return h('div', { class: 'seat' }, plate(c, nameOf(ag, c)),
            h('ul', { class: 'seat-who' }, byC[c].map(function (p) {
              return h('li', {}, h('span', { text: p.name }), ph === 'lobby' ? h('button', { type: 'button', class: 'x', 'aria-label': p.name + 'をはずす', onclick: function () { if (this.dataset.sure) act({ a: 'kick', target: p.pid }); else { this.dataset.sure = '1'; this.textContent = 'はずす？'; } } }, '×') : null);
            })));
        }));
        if (!view.count) add(P.roster, h('p', { class: 'muted', text: 'まだだれも参加していません。' }));
      }
      if (ph === 'speech') {
        const ps = (view.players || []).filter(function (p) { return p.speech; });
        const spotP = view.spot && (view.players || []).find(function (p) { return p.country === view.spot.country && p.speech === view.spot.text; });
        fill(P.spot, view.spot
          ? h('div', { class: 'spot-in' }, plate(view.spot.country, nameOf(ag, view.spot.country), { cls: 'big raise' }), h('p', { class: 'spot-t', text: view.spot.text }),
            btn('映すのをやめる', function () { act({ a: 'spot', target: '' }); }, 'small ghost'))
          : h('p', { class: 'muted', text: '右の一覧から、読み上げる演説を選んでください。' }));
        fill(P.list, ps.length ? sortJa(ps, function (p) { return nameOf(ag, p.country); }).map(function (p) {
          return h('li', { class: spotP && spotP.pid === p.pid ? 'on' : null },
            h('div', { class: 'sp-h' }, h('strong', { text: nameOf(ag, p.country) }), h('span', { class: 'muted small', text: p.name })),
            h('p', { class: 'sp-t', text: p.speech.length > 70 ? p.speech.slice(0, 70) + '…' : p.speech }),
            btn('映す', function () { act({ a: 'spot', target: p.pid }); }, 'small'));
        }) : [h('li', { class: 'muted', text: 'まだ提出がありません。' })]);
      }
      if (ph === 'nego') fill(P.heat, heatmap(ag, view));
      if (ph === 'draft') {
        if (!draftDirty) {
          fill(P.form, ag.clauses.map(function (cl) {
            return h('fieldset', { class: 'cl' }, h('legend', { class: 'cl-t' }, h('span', { class: 'pp-id', text: cl.id.toUpperCase() }), cl.title),
              MUN.vkeys(cl).map(function (v) {
                const id = 'd-' + cl.id + v, n = view.support[cl.id][v];
                const input = h('input', { type: 'radio', name: 'd' + cl.id, id: id, value: v });
                input.checked = view.draft && view.draft[cl.id] === v;
                input.addEventListener('change', function () {
                  draftDirty = true;
                  const d = Object.assign({}, view.draft); d[cl.id] = v;
                  act({ a: 'draft', draft: d }).then(function () { draftDirty = false; });
                });
                return h('label', { class: 'opt', for: id }, input, h('span', { class: 'opt-k', text: v }),
                  h('span', { class: 'opt-b' }, h('span', { class: 'opt-x', text: cl.v[v] }), h('span', { class: 'opt-me', text: '支持 ' + n + '人' })));
              }));
          }));
        }
        fill(P.doc, resolutionDoc(ag, view.draft));
      }
      if (ph === 'vote') {
        const cast = view.votes.filter(function (x) { return x.cast; }).length;
        P.count.textContent = '投票した国 ' + cast + ' / ' + view.votes.length;
        fill(P.board, voteBoard(ag, view.votes.map(function (x) { return { code: x.code, vote: x.cast ? 'cast' : null }; }), { absentLabel: 'まだ' }));
      }
      if (ph === 'result') fill(P.res, resultPanel(ag, view, true));
    }
  }

  function heatmap(ag, view) {
    const total = Math.max(1, view.count);
    return h('div', { class: 'heat-in' }, ag.clauses.map(function (cl) {
      return h('div', { class: 'heat-c' }, h('h3', { class: 'cl-t' }, h('span', { class: 'pp-id', text: cl.id.toUpperCase() }), cl.title),
        MUN.vkeys(cl).map(function (v) {
          const n = view.support[cl.id][v];
          return h('div', { class: 'heat-r' }, h('span', { class: 'opt-k', text: v }), h('span', { class: 'heat-x', text: cl.v[v] }),
            h('span', { class: 'heat-bar' }, h('i', { style: 'width:' + (n / total * 100) + '%' })), h('span', { class: 'heat-n', text: n + '人' }));
        }));
    }));
  }
  function resultPanel(ag, view, teacher) {
    const votes = (view.votes || []).filter(function (x) { return x.vote; });
    const t = MUN.tally(votes);
    return h('div', { class: 'result' },
      h('h2', { class: 'page-title', text: votes.length ? (t.adopted ? '決議案は採択されました' : '決議案は否決されました') : '投票した国がありません' }),
      tallyBox(t, { big: true }),
      chair('賛成' + t.yes + '、反対' + t.no + '、棄権' + t.abs + '。' + (votes.length ? '決議案は' + (t.adopted ? '採択されました。' : '否決されました。') : '')),
      h('p', { class: 'note', text: MUN.VOTE_RULE }),
      voteBoard(ag, (view.votes || []).map(function (x) { return { code: x.code, vote: x.vote, me: view.me && view.me.country === x.code }; }), { absentLabel: '投票なし' }),
      view.draft ? section('決議案', resolutionDoc(ag, view.draft)) : null,
      section('投票理由', h('ul', { class: 'eov' }, sortJa(votes.filter(function (x) { return x.reasons && x.reasons.length; }), function (x) { return nameOf(ag, x.code); }).map(function (x) {
        return h('li', {}, h('span', { class: 'light ' + x.vote }), h('strong', { text: nameOf(ag, x.code) }), h('span', { text: x.reasons.join(' ／ ') }));
      }))),
      section('実際の国連では', realBox(ag)));
  }

  /* ---------- 生徒の画面 ---------- */
  function vStudent(api, code, pid) {
    screen(function () {
      const stage = h('div', {});
      add(app, topbar(), stage);
      mountStudent(stage, api, code, pid);
    });
  }
  function mountStudent(root, api, code, pid) {
    let view = null, phase = null;
    const band = h('div', { class: 'stu-band' });
    const main = h('div', { class: 'wrap' });
    add(root, band, main);
    const tmr = timerEl(function () { return view; }, function () { return poll.offset(); });
    const poll = poller(api, { code: code, pid: pid }, 4000, function (v) { view = v; render(); }, function (e) {
      if (e === 'no_room') fill(main, h('p', { class: 'warn', text: errText(e) }), btn('参加しなおす', vJoin, 'primary'));
    });
    const P = {};
    async function act(body) {
      let r;
      try { r = await api.act(Object.assign({ code: code, pid: pid }, body)); } catch (e) { r = { ok: false, error: 'network' }; }
      if (!r || !r.ok) { alertBox(errText(r && r.error)); return null; }
      poll.push(r.view);
      return r;
    }
    let loadingAg = false;
    function render() {
      if (!view.me) { fill(main, h('p', { class: 'warn', text: ERR.no_player }), btn('参加しなおす', vJoin, 'primary')); phase = null; return; }
      if (!agendaById(view.agenda)) { if (!loadingAg) { loadingAg = true; Box.ensure(view.agenda).then(function () { loadingAg = false; if (agendaById(view.agenda)) render(); }); } return; }
      const ag = agendaById(view.agenda), me = view.me.country;
      fill(band, h('div', { class: 'wrap band-in' },
        plate(me, nameOf(ag, me), { cls: 'mini' }),
        h('span', { class: 'stu-who', text: view.me.name + '　｜　コード ' + view.code }),
        h('span', { class: 'stu-ph', text: phaseLabel(view.phase) }), tmr));
      tmr.paint();
      if (view.phase !== phase) { phase = view.phase; mount(ag, me); }
      update(ag, me);
    }
    function mount(ag, me) {
      fill(main);
      Object.keys(P).forEach(function (k) { delete P[k]; });
      const ph = view.phase, c = countryOf(ag, me);
      const pair = view.partners ? h('p', { class: 'notice small', text: '同じ国の代表がほかに' + view.partners + '人います。相談して決めましょう（票は、同じ国の代表の多数で決まります）。' }) : null;
      if (ph === 'lobby') {
        add(main, h('p', { class: 'kicker', text: 'くじの結果' }), h('h1', { class: 'page-title', text: 'あなたは' + c.name + 'の代表です' }), countryCard(ag, me), pair, chair('先生の合図を待ちましょう。'));
      } else if (ph === 'prep') {
        add(main, h('h1', { class: 'page-title', text: ag.title }), chair('自分の国の立場を確かめましょう。'), pair, ag.custom ? customNote(ag) : null,
          section('議題について', agendaBasics(ag)), section('あなたの国', countryCard(ag, me)),
          section('ポジションペーパー（あなたの国の考え）', [h('p', { class: 'note', text: '★はいちばん望む選択肢、赤い印は「ゆずれない」選択肢です。' }), positionPaper(ag, me)]));
      } else if (ph === 'speech') {
        const ta = h('textarea', { id: 'c-speech', class: 'ta', rows: '7', maxlength: '300', 'aria-label': '演説の文章' });
        ta.value = view.me.speech || '';
        const count = h('span', { class: 'count' });
        const st = h('p', { class: 'muted small', 'aria-live': 'polite' });
        const upd = function () { count.textContent = ta.value.length + ' / 300字'; };
        ta.addEventListener('input', upd); upd();
        const send = btn('演説を提出する', async function () {
          if (!ta.value.trim()) return; send.disabled = true;
          const r = await act({ a: 'speech', text: ta.value.trim() }); send.disabled = false;
          if (r) st.textContent = '提出しました。書き直して、もう一度提出することもできます。';
        }, 'primary');
        P.spot = h('div', {});
        add(main, h('h1', { class: 'page-title', text: '一般討論の演説' }), chair('自分の国が何を求めるのか、ほかの国に伝えましょう。'), pair, P.spot,
          h('div', { class: 'speech-box' }, speechMaker(ag, me, ta, [], upd), ta, h('div', { class: 'row between' }, count, send), st),
          view.me.speech ? h('p', { class: 'muted small', text: 'この国の演説は提出ずみです。' }) : null);
      } else if (ph === 'nego') {
        P.heat = h('div', {});
        add(main, h('h1', { class: 'page-title', text: '交渉（非公式協議）' }),
          chair('席を立って、ほかの国の代表と話し合いましょう。話し合ったら、あなたの国が支持する案を選びます。'), pair,
          h('div', { class: 'clauses' }, ag.clauses.map(function (cl) {
            return h('fieldset', { class: 'cl' }, h('legend', { class: 'cl-t' }, h('span', { class: 'pp-id', text: cl.id.toUpperCase() }), cl.title),
              MUN.vkeys(cl).map(function (v) {
                const id = 's-' + cl.id + v;
                const input = h('input', { type: 'radio', name: 's' + cl.id, id: id, value: v });
                input.checked = view.me.support[cl.id] === v;
                input.addEventListener('change', function () { act({ a: 'support', c: cl.id, v: v }); });
                return h('label', { class: 'opt', for: id }, input, h('span', { class: 'opt-k', text: v }),
                  h('span', { class: 'opt-b' }, h('span', { class: 'opt-x', text: cl.v[v] }),
                    h('span', { class: 'opt-me' }, '自分の国：', stanceChip(MUN.pref(ag, me, cl.id, v))),
                    h('span', { class: 'opt-n', 'data-c': cl.id, 'data-v': v })));
              }));
          })));
      } else if (ph === 'draft' || ph === 'vote') {
        P.doc = h('div', {}); P.adv = h('div', {});
        add(main, h('h1', { class: 'page-title', text: ph === 'draft' ? '決議案' : '投票' }),
          chair(ph === 'draft' ? '決議案がまとめられています。あなたの国から見て、受け入れられるか考えましょう。' : 'あなたの国の代表として、賛成・反対・棄権を選んでください。'), pair, P.adv);
        if (ph === 'vote') {
          let pick = view.me.vote;
          const reason = h('input', { id: 'c-reason', class: 'in', maxlength: '80', placeholder: '理由（80字まで。結果の画面に、国名といっしょに出ます）', value: view.me.reason || '' });
          const st = h('p', { class: 'muted small', 'aria-live': 'polite', text: view.me.vote ? 'あなたは「' + MUN.VOTE_LABEL[view.me.vote] + '」に投票しています。変更もできます。' : '' });
          const bs = ['yes', 'no', 'abs'].map(function (k) {
            return h('button', { type: 'button', class: 'vote-b ' + k, 'aria-pressed': String(pick === k), onclick: function () { pick = k; bs.forEach(function (b) { b.setAttribute('aria-pressed', String(b.dataset.k === k)); }); } , 'data-k': k },
              h('span', { class: 'light ' + k }), MUN.VOTE_LABEL[k]);
          });
          const send = btn('投票する', async function () {
            if (!pick) { st.textContent = '賛成・反対・棄権のどれかを選んでください。'; return; }
            send.disabled = true; const r = await act({ a: 'vote', vote: pick, reason: reason.value.trim() }); send.disabled = false;
            if (r) st.textContent = '「' + MUN.VOTE_LABEL[pick] + '」に投票しました。結果が出るまでは変更できます。';
          }, 'primary');
          add(main, h('div', { class: 'vote-box' }, h('div', { class: 'vote-bs' }, bs), h('label', { for: 'c-reason', class: 'small', text: '投票の理由' }), reason, send, st));
        }
        add(main, P.doc);
      } else if (ph === 'result') {
        P.res = h('div', {});
        add(main, P.res, section('ふりかえり', h('div', { class: 'qs' },
          h('p', { class: 'note', text: '思ったことを、ノートやワークシートに書いておきましょう。' }),
          h('ol', { class: 'flow-q' },
            h('li', { text: 'あなたの国が最後までゆずらなかったこと、反対にゆずったことは何ですか。' }),
            h('li', { text: 'ほかの国の立場に立ってみて、気づいたことは何ですか。' }),
            h('li', { text: '実際の国連で、合意をつくるのがむずかしいのはなぜだと思いますか。' })))));
      }
    }
    function update(ag, me) {
      const ph = view.phase;
      if (ph === 'speech') {
        fill(P.spot, view.spot ? h('div', { class: 'spot small-spot' }, h('p', { class: 'muted small', text: 'いま発表中' }),
          plate(view.spot.country, nameOf(ag, view.spot.country), { cls: 'mini' }), h('p', { class: 'spot-t', text: view.spot.text })) : '');
      }
      if (ph === 'nego') {
        main.querySelectorAll('.opt-n').forEach(function (el) {
          const n = view.support[el.dataset.c][el.dataset.v];
          el.textContent = n ? '支持 ' + n + '人' : '';
        });
      }
      if (ph === 'draft' || ph === 'vote') {
        if (view.draft) {
          const dec = MUN.decide(ag, me, view.draft, { mods: {}, rel: 0 }), g = MUN.goalPct(ag, me, view.draft);
          const red = dec.worst.p <= -3 ? MUN.clauseOf(ag, dec.worst.c) : null;
          fill(P.adv, h('div', { class: 'advice' },
            h('div', { class: 'fc-goal' }, h('span', { text: 'あなたの国の目標' }), h('span', { class: 'fc-n', text: g + '%' }),
              h('span', { class: 'meter' }, h('i', { style: 'width:' + g + '%', class: g >= 60 ? 'ok' : '' }))),
            h('p', { class: 'small' }, '国の立場から考えた目安：', h('strong', { class: 'v-' + dec.vote, text: MUN.VOTE_LABEL[dec.vote] }),
              red ? '（「' + red.title + '」にゆずれない選択肢が入っています）' : ''),
            h('p', { class: 'muted small', text: '目安どおりでなくてもかまいません。交渉での約束や、国どうしの関係も考えて決めましょう。' })));
          fill(P.doc, resolutionDoc(ag, view.draft));
        } else fill(P.doc, h('p', { class: 'muted', text: '先生が決議案をまとめています…' }));
      }
      if (ph === 'result') fill(P.res, resultPanel(ag, view, false));
    }
  }

  /* ---------- はじめる ---------- */
  AI.init();
  vHome();
  window.__MUN_TEST__ = { S: function () { return S; }, AI: AI };
})();

</script>
